# rabbitmq.conf
loopback_users.none = true
heartbeat = 0

# Consumer acknowledgement timeout. RabbitMQ 3.8+/4.x defaults to 30 min (1800000 ms): if a
# consumer holds a delivery unacked that long, the broker closes the channel with
# PRECONDITION_FAILED (406). Seahorse's notebook/executing kernels are interactive consumers that
# legitimately hold a delivery across long idle periods (and long-running cells), which tripped the
# default and killed the kernel's MQ channel — after which "kernel restart" couldn't recover the
# dead consumer thread. Raise it to 7 days so interactive kernels stay connected.
consumer_timeout = 604800000

management.load_definitions = /etc/rabbitmq/definitions.json

# Serve the raw web-stomp WebSocket at /stomp (default is /ws). The proxy routes /stomp to
# this port and the frontend opens a raw WebSocket at /stomp. RabbitMQ 4.x dropped SockJS,
# so the frontend was moved off SockJS to a raw WebSocket STOMP client to match.
web_stomp.ws_path = /stomp

# The browser sends its whole Path=/ cookie jar on the /stomp handshake, and Cowboy rejects a
# Cookie header over max_header_value_length (default 4096) with a 431 — the WebSocket then never
# opens until the user clears cookies. Match the proxy's 16 KB Node limit.
web_stomp.cowboy_opts.max_header_value_length = 16384
