# rabbitmq.conf
loopback_users.none = true
heartbeat = 0

management.load_definitions = /etc/rabbitmq/definitions.json

# Serve the raw web-stomp WebSocket at /stomp (default is /ws). The proxy routes /stomp to
# this port and the frontend opens a raw WebSocket at /stomp. RabbitMQ 4.x dropped SockJS,
# so the frontend was moved off SockJS to a raw WebSocket STOMP client to match.
web_stomp.ws_path = /stomp
