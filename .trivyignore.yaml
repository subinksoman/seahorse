# Trivy suppressions — non-applicable findings only, each documented.
#
# These CVE IDs occur EXCLUSIVELY inside Spark/Hadoop/Parquet uber-jars that SHADE (relocate) their
# own copies of netty/jackson/jline/libthrift into internal package namespaces
# (org.sparkproject.*, org.apache.hadoop.shaded.*, shaded.parquet.*). They are not on the
# application classpath — the app's own netty is 4.2.16, jackson is 2.18.8/2.21.4, and there is no
# app-facing jline/thrift service. Verified: none of these IDs appears in we.jar or any standalone
# (non-shaded) jar in these images. Fixing them would require rebuilding Spark-4.2.0-locked
# Hadoop 3.5.0 / Parquet 1.17.0 — infeasible and higher-risk than the non-applicable finding.
#
# NOTE: the real, app-facing jetty (jetty-http/jetty-security 9.4.58 standalone) is deliberately
# NOT suppressed — CVE-2026-2332 / CVE-2026-10050 remain reported as the documented residual that
# needs a Jetty 12 / scalatra 3 migration (blocked: scalatra 3 is milestone-only for Scala 2.13).
vulnerabilities:
  # --- jackson shaded in hadoop-client-runtime / parquet-jackson / spark-*.jar ---
  - id: CVE-2026-54512
    statement: "Shaded jackson inside Hadoop/Parquet/Spark uber-jars; app jackson is 2.18.8/2.21.4."
  - id: CVE-2026-54513
    statement: "Shaded jackson inside Hadoop/Parquet/Spark uber-jars; app jackson is 2.18.8/2.21.4."
  - id: GHSA-r7wm-3cxj-wff9
    statement: "Shaded jackson-core inside Hadoop/Parquet/Spark uber-jars; not on the app classpath."
