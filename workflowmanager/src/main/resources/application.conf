include "predefined.users.conf"

server {
  host = "0.0.0.0"
  host = ${?WM_HOST}
  port = 9082
  port = ${?WM_PORT}
  startup.timeout = 5000
}

auth-service {
  endpoint = "http://10.10.1.76:35357/v2.0/"
  identity = "service:workflowmanager"
  password = "MmUyN2U2ZDk5ZTlh"
  timeout {
    connection = 1000
    socket = 1000
  }
}

auth {
  user = ${?WM_AUTH_USER}
  pass = ${?WM_AUTH_PASS}
}

roles {
  workflows {
    get = "workflows:get"
    update = "workflows:update"
    create = "workflows:create"
    list = "workflows:list"
    delete = "workflows:delete"
    launch = "workflows:launch"
    abort = "workflows:abort"
  }
}

workflows.api.prefix = "v1/workflows"
operations.api.prefix = "v1/operations"
models.api.prefix = "v1/models"
reports.api.prefix = "v1/reports"

datasource-server {
  address = "http://127.0.0.1:60108/datasourcemanager/v1/"
  address = ${?DATASOURCE_SERVER_ADDRESS}
}

db = {
  url = "jdbc:h2:tcp://database:1521/workflowmanager;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
  url = ${?JDBC_URL}
  # driver is overridden at runtime from the URL's vendor (JdbcVendor); this value only matters
  # for tooling that reads the file directly.
  driver = org.h2.Driver
  user = ""
  user = ${?JDBC_USER}
  password = ""
  password = ${?JDBC_PASSWORD}

  # Connection pool. These keys only take effect because the services build the Database with
  # Slick's forConfig (see PooledDatabase); forURL ignored them entirely and pooled nothing.
  # numThreads bounds Slick's AsyncExecutor and maxConnections the pool — keep them equal, as
  # Slick warns that maxConnections above numThreads "can result in deadlocks".
  connectionPool = "HikariCP"
  numThreads = 20
  numThreads = ${?DB_POOL_MAX}
  maxConnections = 20
  maxConnections = ${?DB_POOL_MAX}
  # min == max: a fixed-size pool, which is what HikariCP itself recommends — no churn, and the
  # connection count is predictable per service.
  minConnections = 20
  minConnections = ${?DB_POOL_MIN}
  connectionTimeout = 30s
  connectionTimeout = ${?DB_POOL_CONNECTION_TIMEOUT}
  validationTimeout = 5s
  # Only has an effect if DB_POOL_MIN is lowered below the max; a fixed-size pool never
  # retires idle connections.
  idleTimeout = 10m
  # Must stay below the server's idle cutoff (MySQL wait_timeout, or any proxy in between), or the
  # pool hands out connections the server has already dropped.
  maxLifetime = 25m
  maxLifetime = ${?DB_POOL_MAX_LIFETIME}
}

# Standardized logging: do not spam dead-letters (e.g. transient actors during the RabbitMQ
# startup race). Actor-system chatter is also pinned to WARN in log4j2.xml.
pekko.log-dead-letters = 0
pekko.log-dead-letters-during-shutdown = off
