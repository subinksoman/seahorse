<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title ng-bind="pageTitle"></title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Deploy-time config (window.dockerConfig); loaded before the webpack bundles, which
       html-webpack-plugin injects at the end of <body>. -->
  <script src="docker-config.js"></script>
</head>
<body>
<loading-mask
  type="warning"
  string="Reconnecting">
</loading-mask>
<!-- ui-router removed: <router-shell> is a downgraded Angular component hosting the @angular/router
     <router-outlet>. This element stays in the (still AngularJS-bootstrapped) index.html so the
     AngularJS droppable directive still applies to it. -->
<router-shell id="wrapper"
         class="animated fadeIn"
         droppable
         droppable-type="frame">
</router-shell>
<feedback></feedback>
<deepsense-loading-spinner-processing ng-if="!stateData.dataIsLoaded">
  Loading
</deepsense-loading-spinner-processing>

</body>
</html>
