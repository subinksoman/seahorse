include classpath("database.default.conf")
include classpath("predefined.users.conf")

database {
  schema = "schedulingmanager"
  quartzSchema = "schedulingmanager_quartz"
}

jetty {
  port = ${?PORT}
}

session-manager {
  url = ${?SM_URL}
  timeout = 24h
  user = ${?SM_USER}
  pass = ${?SM_PASS}
}

workflow-manager {
  url = ${?WM_URL}
  timeout = 24h
  user = ${?WM_AUTH_USER}
  pass = ${?WM_AUTH_PASS}
}

presets-manager = ${workflow-manager}

scheduling-manager {
  seahorseUrl = "http://localhost:33321/"
  seahorseUrl = ${?SEAHORSE_EXTERNAL_URL}
  workflowUrlPattern = ${scheduling-manager.seahorseUrl}"#/workflows/%s/editor"
}

org.quartz {
  jobStore {
    dataSource = "h2"
    class = "org.quartz.impl.jdbcjobstore.JobStoreTX"
    driverDelegateClass = "org.quartz.impl.jdbcjobstore.StdJDBCDelegate"
    driverDelegateClass = ${?QUARTZ_DELEGATE}
    # H2 quotes the schema; MySQL uses an unquoted schema.table prefix (set QUARTZ_TABLE_PREFIX).
    tablePrefix = "\"schedulingmanager_quartz\".QRTZ_"
    tablePrefix = ${?QUARTZ_TABLE_PREFIX}
  }
  dataSource {
    h2 = {
      driver = "org.h2.Driver"
      driver = ${?QUARTZ_DRIVER}
      URL = ${databaseSlick.db.url}
      user = ""
      user = ${?JDBC_USER}
      password = ""
      password = ${?JDBC_PASSWORD}
    }
  }
  threadPool {
    class = "org.quartz.simpl.SimpleThreadPool"
    threadCount = 5
  }
}

email-sender {
  from = "6D Analytical Engine <seahorse-scheduler@deepsense.ai>"
  smtp {
    host = "localhost"
    host = ${?MAIL_SERVER_HOST}
    port = 25
    port = ${?MAIL_SERVER_PORT}
  }
}

# Standardized logging: do not spam dead-letters (e.g. transient actors during the RabbitMQ
# startup race). Actor-system chatter is also pinned to WARN in log4j2.xml.
pekko.log-dead-letters = 0
pekko.log-dead-letters-during-shutdown = off
